name: CI
permissions:
  contents: read

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup pixi
        uses: prefix-dev/setup-pixi@2253d9c9310442c09975d64615591b5b381da6e7  # v0.10.0
        with:
          pixi-version: v0.71.3
          cache: false
          frozen: true

      - name: Run linting checks
        run: pixi run lint

  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rhel_version: [8, 9, 10]
    container:
      image: ghcr.io/nsls2/epics-alma${{ matrix.rhel_version }}:latest
      options: --user root
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup pixi
        uses: prefix-dev/setup-pixi@2253d9c9310442c09975d64615591b5b381da6e7  # v0.10.0
        with:
          pixi-version: v0.71.3
          cache: false
          frozen: true

      - name: Create CONFIG_SITE.local
        run: |
          cat > configure/CONFIG_SITE.local << EOF
          # CONFIG_SITE.local for GitHub Actions CI
          CHECK_RELEASE=NO
          BUILD_IOCS=YES
          BUILD_TESTS=YES

          # Enable coverage flags for unit tests
          USR_CXX_FLAGS_Linux += --coverage
          USR_LD_FLAGS_Linux += --coverage

          EOF

          echo "CONFIG_SITE.local created:"
          cat configure/CONFIG_SITE.local

      - name: Create RELEASE.local
        run: |
          cat > configure/RELEASE.local << EOF
          # RELEASE.local for GitHub Actions CI
          ASYN=/usr/lib/epics
          DEVIOCSTATS=/usr/lib/epics
          CALC=/usr/lib/epics
          EPICS_BASE=/usr/lib/epics
          EOF

          echo "RELEASE.local created:"
          cat configure/RELEASE.local

      - name: Build the driver and unit tests
        run: make -j4

      - name: Run the tests with valgrind
        run: pixi run tests-w-valgrind